# Publish `lazybiz` to npm from a tag, with no token anywhere.
#
# npm Trusted Publishing: npm trusts THIS repository and THIS workflow filename,
# and GitHub hands the run a short-lived OIDC credential instead. That is why
# `id-token: write` is required, and why this file names no token and no
# repository secret at all — carrying one would be the thing it exists to remove.
name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      # npm's OIDC support landed in npm 11.5.1, and Node 20 still bundles npm
      # 10. Without this, `npm publish` asks to be handed a credential instead
      # of minting its own. Pinned to 11.x on purpose: `npm@latest` is npm 12,
      # which refuses to install on Node 20 and fails the run before the guard.
      - name: use an npm that speaks OIDC
        run: npm install -g 'npm@^11.5.1'

      # A tag that disagrees with package.json would publish the wrong version,
      # or fail deep inside `npm publish` where the error reads as a registry
      # problem. Fail here instead, before anything is sent.
      - name: version guard
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "package.json $version does not match tag $GITHUB_REF_NAME"
            exit 1
          fi
          echo "package.json $version matches tag $GITHUB_REF_NAME"

      - run: npm publish --provenance --access public
